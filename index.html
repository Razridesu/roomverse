<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

<title>ROOMVERSE — Your space.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Noto+Serif+JP:wght@400;500&display=swap');
:root{--quartz:#f1eee8;--white:#fff;--ink:#383735;--line:#d8d5d0;--muted:#78736d;--panel:#ffffffed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--quartz);color:var(--ink);font-family:'Noto Serif JP',serif}button,select,input{font:inherit}button{cursor:pointer}#scene{position:fixed;inset:0;touch-action:none}canvas{display:block}
.topbar{position:fixed;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:10;gap:8px}.brand,.actions,.chip,.status{pointer-events:auto;backdrop-filter:blur(16px);background:#fffffff2;border:1px solid #dfdbd5;border-radius:12px;box-shadow:0 4px 25px #2d24110b}.brand{padding:9px 14px;font:500 clamp(19px,3.5vw,26px)/1 'Bodoni Moda',serif;letter-spacing:.07em}.actions{display:flex;gap:5px;padding:5px}.icon-btn{border:0;background:transparent;color:var(--ink);min-width:38px;height:38px;border-radius:9px;font:18px Arial,sans-serif}.icon-btn:hover,.icon-btn.active{background:#eeebe5}.icon-btn:disabled{opacity:.35;cursor:default}
.bottom{position:fixed;bottom:max(17px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;z-index:10;pointer-events:none}.room-label{pointer-events:auto;background:#ffffffde;border:1px solid #dfdbd5;border-radius:11px;padding:10px 12px;font:13px 'Bodoni Moda',serif;letter-spacing:.03em;backdrop-filter:blur(12px)}.primary{pointer-events:auto;background:var(--ink);border:1px solid var(--ink);color:white;border-radius:26px;padding:12px 20px;font:14px 'Bodoni Moda',serif;letter-spacing:.11em;min-width:105px;box-shadow:0 8px 26px #25221d20}.primary:hover{background:#57544f}
.editor{position:fixed;z-index:9;bottom:calc(max(74px,env(safe-area-inset-bottom) + 67px));left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 30px));background:#fffffff3;backdrop-filter:blur(20px);border:1px solid #ddd8d2;border-radius:18px;padding:14px;box-shadow:0 12px 40px #2c24151c;display:none;max-height:min(58vh,560px);overflow:auto}.editor.open{display:block}.section-title{font:500 15px 'Bodoni Moda',serif;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.caption{color:var(--muted);font-size:11px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 6px;flex:1;font-size:12px}.tab.selected{background:#e7e3dc;border-color:#b4aea4}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tool{background:#f8f7f4;border:1px solid #e1ddd7;color:var(--ink);border-radius:12px;padding:12px 6px;min-height:68px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}.tool em{font-size:22px;font-style:normal}.tool:disabled{opacity:.4}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.sub-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.small{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 10px;border-radius:9px;font-size:12px}.small.danger{color:#9e5555}.small:disabled{opacity:.4}.field{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;font-size:12px}input[type=range]{width:56%;accent-color:#6e726b}select{border-radius:8px;border:1px solid var(--line);background:white;color:var(--ink);padding:8px;max-width:56%}.hint{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:8;background:#ffffffe0;padding:8px 12px;border-radius:30px;border:1px solid #e1ddd7;color:#57534e;font-size:11px;text-align:center;max-width:calc(100vw - 20px);pointer-events:none;transition:opacity .3s}.toast{position:fixed;z-index:30;top:85px;left:50%;transform:translateX(-50%);background:#383735;color:#fff;padding:11px 17px;border-radius:12px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{opacity:1}.status{position:fixed;right:16px;top:75px;z-index:7;padding:7px 10px;font-size:10px;color:var(--muted)}.hide{display:none!important}
@media(min-width:900px){.editor{left:20px;top:96px;bottom:auto;transform:none;width:296px;max-height:calc(100vh - 125px);padding:16px}.status{top:76px}.bottom{left:20px;right:20px}.tools{grid-template-columns:repeat(2,1fr)}.tool{min-height:80px}.hint{top:22px;left:50%}}
@media(max-height:540px){.editor{max-height:50vh}.hint{display:none}}
</style>
</head>
<body>
<div id="scene" role="application" aria-label="3Dルームビュー"></div>
<div class="topbar"><div class="brand">ROOMVERSE</div><div class="actions"><button class="icon-btn" id="undo" aria-label="元に戻す" title="元に戻す">↶</button><button class="icon-btn" id="redo" aria-label="やり直す" title="やり直す">↷</button><button class="icon-btn" id="save" aria-label="保存" title="保存">⌑</button><button class="icon-btn" id="resetView" aria-label="カメラ初期化" title="視点を戻す">⌖</button></div></div>
<div class="hint" id="hint">空間をドラッグして回転 · ピンチでズーム</div><div class="status" id="status">ローカル保存</div><div class="toast" id="toast" role="status"></div>
<div class="editor" id="editor"><div class="section-title"><span>ROOM EDITOR</span><span class="caption" id="selectionText">家具を選択してください</span></div><div class="tabs"><button class="tab selected" data-tab="furniture">家具</button><button class="tab" data-tab="interior">内装</button><button class="tab" data-tab="lighting">照明</button></div><div id="panel"></div></div>
<div class="bottom"><div class="room-label">MY FIRST ROOM</div><button class="primary" id="toggleEdit">EDIT</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=s=>document.querySelector(s), sceneHost=$('#scene');
const scene=new THREE.Scene();scene.background=new THREE.Color('#e8e4dd');
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.08,120); camera.position.set(9,8,11);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.52;sceneHost.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.075;controls.target.set(0,.9,0);controls.minDistance=3.4;controls.maxDistance=24;controls.maxPolarAngle=Math.PI/2-.04;controls.enablePan=true;controls.screenSpacePanning=false;controls.update();
scene.add(new THREE.HemisphereLight('#ffffff','#b6aba0',2.1)); const sunlight=new THREE.DirectionalLight('#fff6e9',2.65);sunlight.position.set(-3,9,5);sunlight.castShadow=true;sunlight.shadow.mapSize.set(1024,1024);sunlight.shadow.camera.left=-11;sunlight.shadow.camera.right=11;sunlight.shadow.camera.top=11;sunlight.shadow.camera.bottom=-11;sunlight.shadow.bias=-.0002;scene.add(sunlight);
const indoor=new THREE.PointLight('#ffdbad',.5,13); indoor.position.set(0,2.4,0);scene.add(indoor);
const mat=(color,roughness=.84,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness}); const quartz=mat('#f1eee8'),oak=mat('#b8a18a'),side=mat('#ded8cf');
function box(w,h,d,m,x,y,z,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;return o}
const room=new THREE.Group();scene.add(room);const floor=box(6,.16,8,oak,0,-.08,0,false);room.add(floor);const back=box(6,2.8,.13,quartz,0,1.4,-4,false);room.add(back);const left=box(.13,2.8,8,quartz,-3,1.4,0,false);room.add(left);
// Architectural trim and window accent
room.add(box(6,.065,.09,mat('#e0d9d0'),0,.06,-3.88,false));room.add(box(.09,.065,8,mat('#e0d9d0'),-2.88,.06,0,false));
const windowFrame=mat('#d7d4d0');room.add(box(.05,1.6,1.55,windowFrame,-2.91,1.65,-1.5,false));room.add(box(.07,.04,1.55,mat('#ffffff'),-2.88,1.7,-1.5,false));
function createFurniture(type){const g=new THREE.Group();g.userData.type=type;let m1=mat('#e8e1d6'),m2=mat('#b7a08a'),metal=mat('#6c6c69',.45,.45);if(type==='sofa'){
 g.add(box(1.95,.42,.82,m1,0,.44,0));g.add(box(1.95,.69,.22,m1,0,.72,-.4));g.add(box(.20,.46,.88,m1,-1.05,.49,0));g.add(box(.20,.46,.88,m1,1.05,.49,0));for(const x of [-.72,.72])g.add(box(.56,.11,.57,mat('#f2eee7'),x,.69,.04));for(const x of [-.8,.8])for(const z of [-.27,.28])g.add(box(.13,.18,.13,m2,x,.13,z));
}else if(type==='table'){
 g.add(box(1.25,.12,.75,m2,0,.55,0));for(const x of [-.50,.50])for(const z of [-.25,.25])g.add(box(.085,.5,.085,metal,x,.27,z));
}else if(type==='plant'){
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(.22,.16,.43,14),mat('#cec6ba')));g.children[0].position.y=.22;g.children[0].castShadow=true;const stem=mat('#77775b');g.add(box(.045,.65,.045,stem,0,.8,0));let leaf=mat('#69846b');[[.12,.9,.06],[-.18,.83,-.06],[0,1.12,0],[.04,1.02,-.14],[-.06,1.02,.17]].forEach(([x,y,z],i)=>{const b=new THREE.Mesh(new THREE.SphereGeometry(.23,9,7),leaf);b.scale.set(1.3,.42,.58);b.position.set(x,y,z);b.rotation.y=i*1.2;b.castShadow=true;g.add(b)})
}g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
const objects=[];const defaults=[{id:1,type:'sofa',x:-.85,z:-1.45,r:0},{id:2,type:'table',x:-.65,z:.17,r:0},{id:3,type:'plant',x:1.65,z:-2.75,r:0}];
let nextId=4,selection=null,editing=false,tab='furniture',moveMode=false,dragging=false,oldDrag=null,undoStack=[],redoStack=[],lightStrength=60,wallName='quartz',floorName='oak';
function addObject(data){const g=createFurniture(data.type);g.userData.id=data.id;g.position.set(data.x,0,data.z);g.rotation.y=data.r||0;scene.add(g);objects.push(g);return g}
function serialize(){return{objects:objects.map(o=>({id:o.userData.id,type:o.userData.type,x:Number(o.position.x.toFixed(3)),z:Number(o.position.z.toFixed(3)),r:Number(o.rotation.y.toFixed(3))})),lightStrength,wallName,floorName}}
function apply(data){for(const o of objects)scene.remove(o);objects.length=0;for(const d of data.objects||defaults)addObject(d);nextId=Math.max(4,...objects.map(o=>o.userData.id+1));lightStrength=data.lightStrength??60;wallName=data.wallName||'quartz';floorName=data.floorName||'oak';applyMaterials();selection=null;renderPanel()}
function applyMaterials(){const walls={quartz:'#f1eee8',ivory:'#e1d8cd',stone:'#d3d1cb'};const floors={oak:'#b8a18a',light:'#d9c9b7',stone:'#d1d1cc'};quartz.color.set(walls[wallName]||walls.quartz);oak.color.set(floors[floorName]||floors.oak);indoor.intensity=lightStrength/100*1.5;sunlight.intensity=1.15+lightStrength/100*2}
function snapshot(){undoStack.push(JSON.stringify(serialize()));if(undoStack.length>60)undoStack.shift();redoStack=[];refreshUndo()}
function restore(stackFrom,stackTo){if(!stackFrom.length)return;stackTo.push(JSON.stringify(serialize()));apply(JSON.parse(stackFrom.pop()));refreshUndo();scheduleSave()}
function refreshUndo(){$('#undo').disabled=!undoStack.length;$('#redo').disabled=!redoStack.length}
let saveTimer;function scheduleSave(){$('#status').textContent='未保存の変更';clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,950)}
function saveNow(){try{localStorage.setItem('roomverse-prototype-v1',JSON.stringify(serialize()));$('#status').textContent='この端末に保存済み';notify('この端末に保存しました')}catch(e){$('#status').textContent='保存に失敗しました';notify('保存容量などを確認してください')}}
let toastTimer;function notify(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1700)}
function selectObject(o){selection=o;renderPanel();highlight()}
const selectionMat=mat('#7d9789');function highlight(){objects.forEach(o=>o.traverse(child=>{if(child.isMesh&&child.userData.outline){o.remove(child)}}))}
function furniturePanel(){return `<div class="tools"><button class="tool" data-add="sofa"><em>▱</em>ソファを追加</button><button class="tool" data-add="table"><em>▤</em>テーブルを追加</button><button class="tool" data-add="plant"><em>♧</em>観葉植物を追加</button></div><div style="height:11px"></div>${selection?`<div class="row"><b style="font-size:13px">選択中：${{sofa:'ソファ',table:'テーブル',plant:'観葉植物'}[selection.userData.type]}</b><span class="caption">ID ${selection.userData.id}</span></div><div class="sub-actions"><button class="small ${moveMode?'active':''}" id="move" aria-pressed="${moveMode}">${moveMode?'✓ 移動中':'⇄ 移動'}</button><button class="small" id="rotateL">↶ 左回転</button><button class="small" id="rotateR">↷ 右回転</button><button class="small" id="duplicate">⊕ 複製</button><button class="small danger" id="delete">削除</button></div><p class="caption">移動を押してから家具をドラッグ。カメラ回転との誤操作を防ぎます。</p>`:`<p class="caption">家具を追加するか、3D画面内の家具を選択してください。</p>`}`}
function interiorPanel(){return `<div class="field"><label>壁材</label><select id="wall"><option value="quartz" ${wallName==='quartz'?'selected':''}>QUARTZ WHITE</option><option value="ivory" ${wallName==='ivory'?'selected':''}>WARM IVORY</option><option value="stone" ${wallName==='stone'?'selected':''}>STONE GRAY</option></select></div><div class="field"><label>床材</label><select id="floor"><option value="oak" ${floorName==='oak'?'selected':''}>NATURAL OAK</option><option value="light" ${floorName==='light'?'selected':''}>LIGHT WOOD</option><option value="stone" ${floorName==='stone'?'selected':''}>LIGHT STONE</option></select></div>`}
function lightingPanel(){return `<div class="field"><label>明るさ：<span id="lightValue">${lightStrength}%</span></label><input id="light" type="range" min="10" max="100" value="${lightStrength}"/></div><p class="caption">リアルタイムで自然光・室内灯の明るさを調整します。</p>`}
function renderPanel(){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('selected',e.dataset.tab===tab));$('#selectionText').textContent=selection?'OBJECT SELECTED':'YOUR SPACE';$('#panel').innerHTML=tab==='furniture'?furniturePanel():tab==='interior'?interiorPanel():lightingPanel();$('#panel').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{snapshot();const item=addObject({id:nextId++,type:b.dataset.add,x:0,z:.9,r:0});selectObject(item);moveMode=true;scheduleSave();notify('家具を追加しました。移動モードです')});if(selection&&tab==='furniture'){$('#move').onclick=()=>{moveMode=!moveMode;renderPanel()};$('#rotateL').onclick=()=>{snapshot();selection.rotation.y-=Math.PI/12;renderPanel();scheduleSave()};$('#rotateR').onclick=()=>{snapshot();selection.rotation.y+=Math.PI/12;renderPanel();scheduleSave()};$('#duplicate').onclick=()=>{snapshot();const item=addObject({...serialize().objects.find(o=>o.id===selection.userData.id),id:nextId++,x:Math.min(2.25,selection.position.x+.5),z:Math.min(3.25,selection.position.z+.5)});selectObject(item);scheduleSave()};$('#delete').onclick=()=>{snapshot();scene.remove(selection);objects.splice(objects.indexOf(selection),1);selection=null;moveMode=false;renderPanel();scheduleSave()}}if(tab==='interior'){for(const [key,prop] of [['wall','wallName'],['floor','floorName']]){$('#'+key).onchange=e=>{snapshot();if(prop==='wallName')wallName=e.target.value;else floorName=e.target.value;applyMaterials();scheduleSave()}}}if(tab==='lighting'){$('#light').onpointerdown=()=>snapshot();$('#light').oninput=e=>{lightStrength=Number(e.target.value);$('#lightValue').textContent=lightStrength+'%';applyMaterials();scheduleSave()}}}
let pointerStart=null;const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);function getRay(e){const b=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);raycaster.setFromCamera(mouse,camera)}
function hitObject(e){getRay(e);const hit=raycaster.intersectObjects(objects,true)[0];if(!hit)return null;let o=hit.object;while(o.parent&&!o.userData.id)o=o.parent;return o.userData.id?o:null}
renderer.domElement.addEventListener('pointerdown',e=>{if(!editing||e.button!==0||!e.isPrimary)return;pointerStart={x:e.clientX,y:e.clientY};const hit=hitObject(e);if(hit){selectObject(hit);if(moveMode){snapshot();dragging=true;oldDrag={x:hit.position.x,z:hit.position.z};controls.enabled=false;renderer.domElement.setPointerCapture(e.pointerId)}}});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging||!selection)return;getRay(e);const out=new THREE.Vector3();if(raycaster.ray.intersectPlane(ground,out)){selection.position.x=THREE.MathUtils.clamp(out.x,-2.35,2.35);selection.position.z=THREE.MathUtils.clamp(out.z,-3.36,3.36)}});
function finishDrag(){if(dragging){dragging=false;controls.enabled=true;moveMode=false;renderPanel();scheduleSave()}}
renderer.domElement.addEventListener('pointerup',finishDrag);renderer.domElement.addEventListener('pointercancel',finishDrag);
$('#toggleEdit').onclick=()=>{editing=!editing;moveMode=false;$('#editor').classList.toggle('open',editing);$('#toggleEdit').textContent=editing?'DONE':'EDIT';$('#hint').textContent=editing?'家具をタップして選択・移動は編集パネルから':'空間をドラッグして回転 · ピンチでズーム';renderPanel()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderPanel()});$('#save').onclick=saveNow;$('#undo').onclick=()=>restore(undoStack,redoStack);$('#redo').onclick=()=>restore(redoStack,undoStack);$('#resetView').onclick=()=>{camera.position.set(9,8,11);controls.target.set(0,.9,0);controls.update();notify('視点を戻しました')};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow()}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?restore(redoStack,undoStack):restore(undoStack,redoStack)}else if((e.key==='Delete'||e.key==='Backspace')&&selection&&editing&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){snapshot();scene.remove(selection);objects.splice(objects.indexOf(selection),1);selection=null;renderPanel();scheduleSave()}});
function fit(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',fit);
try{let saved=localStorage.getItem('roomverse-prototype-v1');apply(saved?JSON.parse(saved):{objects:defaults});if(!saved)saveNow()}catch(e){apply({objects:defaults})}refreshUndo();const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
