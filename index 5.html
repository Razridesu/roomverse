const accent=box(.02,2.25,1.7,mat('#5e5d5b',.94),-2.92,1.42,-1.45,false);accent.visible=false;room.add(accent);
function createFurniture(type){const g=new THREE.Group();g.userData.type=type;let m1=mat('#e8e1d6'),m2=mat('#b7a08a'),metal=mat('#6c6c69',.45,.45);if(type==='sofa'){
 g.add(rounded(1.95,.42,.82,m1,0,.44,0,.13));g.add(rounded(1.95,.69,.22,m1,0,.72,-.4,.09));g.add(rounded(.20,.46,.88,m1,-1.05,.49,0,.07));g.add(rounded(.20,.46,.88,m1,1.05,.49,0,.07));for(const x of [-.72,.72])g.add(rounded(.56,.13,.57,mat('#f2eee7'),x,.69,.04,.05));for(const x of [-.8,.8])for(const z of [-.27,.28])g.add(box(.13,.18,.13,m2,x,.13,z));
}else if(type==='table'){
 g.add(rounded(1.25,.12,.75,mat('#bcb4a9',.22,.03),0,.55,0,.045));for(const x of [-.50,.50])for(const z of [-.25,.25])g.add(box(.085,.5,.085,metal,x,.27,z));
}else if(type==='plant'){
 g.add(new THREE.Mesh(new THREE.CylinderGeometry(.22,.16,.43,14),mat('#cec6ba')));g.children[0].position.y=.22;g.children[0].castShadow=true;const stem=mat('#77775b');g.add(box(.045,.65,.045,stem,0,.8,0));let leaf=mat('#69846b');[[.12,.9,.06],[-.18,.83,-.06],[0,1.12,0],[.04,1.02,-.14],[-.06,1.02,.17]].forEach(([x,y,z],i)=>{const b=new THREE.Mesh(new THREE.SphereGeometry(.23,9,7),leaf);b.scale.set(1.3,.42,.58);b.position.set(x,y,z);b.rotation.y=i*1.2;b.castShadow=true;g.add(b)})
}else if(type==='bed'){
 const linen=mat('#eeeae3'),frame=mat('#a9927c'),pillow=mat('#ffffff');
 g.add(box(1.65,.29,2.2,frame,0,.24,0));g.add(box(1.56,.24,2.02,linen,0,.48,.02));
 g.add(box(1.65,.85,.13,frame,0,.64,-1.12));
 for(const x of [-.42,.42])g.add(box(.65,.12,.38,pillow,x,.66,-.72));
 g.add(box(1.55,.045,.95,mat('#d4cabc'),0,.64,.40));
 }else if(type==='desk'){
 const wood=mat('#b8a18a');g.add(box(1.7,.10,.7,wood,0,.78,0));
 for(const x of [-.71,.71])for(const z of [-.25,.25])g.add(box(.07,.76,.07,metal,x,.39,z));
 g.add(box(.68,.43,.05,mat('#6f7476',.45,.12),0,1.05,-.15));g.add(box(.10,.08,.09,metal,0,.81,-.14));
 }else if(type==='chair'){
 const fabric=mat('#d5d0c7');g.add(rounded(.65,.14,.64,fabric,0,.51,0,.055));g.add(rounded(.64,.69,.12,fabric,0,.87,-.28,.05));
 for(const x of [-.25,.25])for(const z of [-.22,.22])g.add(box(.055,.46,.055,metal,x,.25,z));
 }else if(type==='lamp'){const silver=mat('#777874',.38,.4);g.add(new THREE.Mesh(new THREE.CylinderGeometry(.26,.27,.08,22),silver));g.children[0].position.y=.045;g.add(box(.045,1.65,.045,silver,0,.86,0));g.add(new THREE.Mesh(new THREE.CylinderGeometry(.28,.19,.41,24),mat('#f7f2e9',.77)));g.children[2].position.y=1.7;}else if(type==='cabinet'){g.add(rounded(1.55,.60,.44,mat('#b2a99d',.47),0,.48,0,.04));for(const x of [-.38,.38])g.add(box(.015,.36,.36,mat('#d3cdc6'),x,.49,.23));}else if(type==='rug'){g.add(rounded(2.45,.025,1.65,mat('#d8d4cd',1),0,.021,0,.01));}else if(type==='art'){g.add(rounded(1.05,.9,.055,mat('#77716b',.55),0,1.25,0,.02));g.add(box(.94,.78,.06,mat('#d4c3af',.95),0,1.25,.035));}g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
const objects=[];const defaults=[{id:1,type:'sofa',x:-.85,z:-1.45,r:0},{id:2,type:'table',x:-.65,z:.17,r:0},{id:3,type:'plant',x:1.65,z:-2.75,r:0}];
let nextId=4,selection=null,editing=false,tab='furniture',moveMode=false,dragging=false,oldDrag=null,undoStack=[],redoStack=[],lightStrength=60,wallName='quartz',floorName='oak',timeOfDay='day',windowView='cityday',panelExpanded=false,panelCollapsed=false;
function addObject(data){const g=createFurniture(data.type);g.userData.id=data.id;g.position.set(data.x,0,data.z);g.rotation.y=data.r||0;scene.add(g);objects.push(g);return g}
function serialize(){return{objects:objects.map(o=>({id:o.userData.id,type:o.userData.type,x:Number(o.position.x.toFixed(3)),z:Number(o.position.z.toFixed(3)),r:Number(o.rotation.y.toFixed(3))})),lightStrength,wallName,floorName,timeOfDay,windowView}}
function apply(data){for(const o of objects)scene.remove(o);objects.length=0;for(const d of data.objects||defaults)addObject(d);nextId=Math.max(4,...objects.map(o=>o.userData.id+1));lightStrength=data.lightStrength??60;wallName=data.wallName||'quartz';floorName=data.floorName||'oak';timeOfDay=data.timeOfDay||'day';windowView=data.windowView||'cityday';applyMaterials();selection=null;renderPanel()}
function applyMaterials(){const walls={quartz:'#f1eee8',ivory:'#e1d8cd',stone:'#d3d1cb',linen:'#f9f7f1',concrete:'#b8b8b4'};const floors={oak:'#b8a18a',light:'#d9c9b7',stone:'#d1d1cc',walnut:'#786252',quartz:'#e8e4dd'};quartz.color.set(walls[wallName]||walls.quartz);oak.color.set(floors[floorName]||floors.oak);if(oak.map){oak.map=null}oak.color.set(floors[floorName]||floors.oak);if(['quartz','stone'].includes(floorName)){oak.map=tileMap;oak.color.set('#ffffff');oak.roughness=.22;oak.metalness=.1}else if(['oak','light','walnut'].includes(floorName)){oak.map=woodMap;oak.color.set(floorName==='walnut'?'#96857b':'#ffffff');oak.roughness=.48;oak.metalness=0}oak.needsUpdate=true;outdoor.material.map?.dispose();outdoor.material.map=exteriorTexture(windowView);outdoor.material.needsUpdate=true;const intensity={day:1,sunset:.56,night:.13}[timeOfDay]||1;indoor.intensity=lightStrength/100*(timeOfDay==='night'?2.8:1.25);sunlight.intensity=(.9+lightStrength/100*1.8)*intensity;sunlight.color.set(timeOfDay==='sunset'?'#ffd2aa':timeOfDay==='night'?'#afc2db':'#fff6e9');scene.background.set(timeOfDay==='night'?'#a8aab0':timeOfDay==='sunset'?'#e5d3c2':'#e8e4dd');sunlight.intensity*=windowView==='citynight'?.2:windowView==='rainy'?.55:1;indoor.intensity+=windowView==='citynight'?.7:0}
function snapshot(){undoStack.push(JSON.stringify(serialize()));if(undoStack.length>60)undoStack.shift();redoStack=[];refreshUndo()}
function restore(stackFrom,stackTo){if(!stackFrom.length)return;stackTo.push(JSON.stringify(serialize()));apply(JSON.parse(stackFrom.pop()));refreshUndo();scheduleSave()}
function refreshUndo(){$('#undo').disabled=!undoStack.length;$('#redo').disabled=!redoStack.length}
let saveTimer;function scheduleSave(){$('#status').textContent='未保存の変更';clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,950)}
function saveNow(){try{localStorage.setItem('roomverse-prototype-v3',JSON.stringify(serialize()));$('#status').textContent='この端末に保存済み';notify('この端末に保存しました')}catch(e){$('#status').textContent='保存に失敗しました';notify('保存容量などを確認してください')}}
let toastTimer;function notify(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1700)}
function selectObject(o){selection=o;renderPanel();highlight()}
const selectionMat=mat('#7d9789');function highlight(){objects.forEach(o=>o.traverse(child=>{if(child.isMesh&&child.userData.outline){o.remove(child)}}))}
const names={sofa:'ソファ',table:'テーブル',plant:'観葉植物',bed:'ベッド',desk:'デスク',chair:'チェア',lamp:'フロアライト',cabinet:'キャビネット',rug:'ラグ',art:'アート'};
function furniturePanel(){return `<div class="tools">${[['sofa','▱'],['table','▤'],['plant','♧'],['bed','▥'],['desk','▱'],['chair','♙'],['lamp','☼'],['cabinet','▤'],['rug','▭'],['art','▣']].map(([id,icon])=>`<button class="tool" data-add="${id}"><em>${icon}</em>${names[id]}を追加</button>`).join('')}</div>${selection?`<div style="height:8px"></div><div class="row"><b style="font-size:12px">選択中：${names[selection.userData.type]}</b><span class="caption">ID ${selection.userData.id}</span></div><div class="sub-actions"><button class="small ${moveMode?'active':''}" id="move" aria-pressed="${moveMode}">${moveMode?'✓ 移動中':'⇄ 移動'}</button><button class="small" id="rotateL">↶ 左回転</button><button class="small" id="rotateR">↷ 右回転</button><button class="small" id="duplicate">⊕ 複製</button><button class="small danger" id="delete">削除</button></div><p class="caption panel-note">移動を選んでからドラッグ。通常時はカメラ操作を優先。</p>`:`<p class="caption panel-note">家具を追加するか、3D画面で家具を選択。</p>`}`}
function interiorPanel(){return `<div class="field"><label>壁材</label><select id="wall"><option value="quartz" ${wallName==='quartz'?'selected':''}>QUARTZ WHITE</option><option value="linen" ${wallName==='linen'?'selected':''}>LINEN WHITE</option><option value="ivory" ${wallName==='ivory'?'selected':''}>WARM IVORY</option><option value="stone" ${wallName==='stone'?'selected':''}>STONE GRAY</option><option value="concrete" ${wallName==='concrete'?'selected':''}>SOFT CONCRETE</option></select></div><div class="field"><label>床材</label><select id="floor"><option value="oak" ${floorName==='oak'?'selected':''}>NATURAL OAK</option><option value="light" ${floorName==='light'?'selected':''}>LIGHT WOOD</option><option value="stone" ${floorName==='stone'?'selected':''}>LIGHT STONE</option><option value="walnut" ${floorName==='walnut'?'selected':''}>WALNUT</option><option value="quartz" ${floorName==='quartz'?'selected':''}>QUARTZ</option></select></div>`}
function lightingPanel(){return `<div class="caption">光の時間帯</div><div class="setting-row">${[['day','DAY'],['sunset','SUNSET'],['night','NIGHT']].map(([id,t])=>`<button class="setting-chip ${timeOfDay===id?'selected':''}" data-time="${id}">${t}</button>`).join('')}</div><div class="field"><label>明るさ：<span id="lightValue">${lightStrength}%</span></label><input id="light" type="range" min="10" max="100" value="${lightStrength}"/></div><p class="caption panel-note">昼・夕方・夜と室内の明るさを調整。</p>`}
function windowPanel(){return `<div class="caption">WINDOW VIEW · 窓の外を変更</div><div class="window-options">${[['cityday','CITY DAY','街・昼'],['citynight','CITY NIGHT','街・夜'],['sunset','SUNSET','夕焼け'],['forest','FOREST','森林'],['ocean','OCEAN','海'],['rainy','RAINY','雨']].map(([id,en,ja])=>`<button class="window-option ${windowView===id?'selected':''}" data-window="${id}">${ja}<small>${en}</small></button>`).join('')}</div><button class="window-corner" id="lookAtWindow">◉ 窓の方向を見る</button><p class="window-hint">室内の奥の壁に窓があります。景色を押すと切り替わります。</p>`}
function renderPanel(){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('selected',e.dataset.tab===tab));$('#selectionText').textContent=selection?'OBJECT SELECTED':'YOUR SPACE';$('#panel').innerHTML=tab==='furniture'?furniturePanel():tab==='interior'?interiorPanel():tab==='lighting'?lightingPanel():windowPanel();$('#panel').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{snapshot();const item=addObject({id:nextId++,type:b.dataset.add,x:0,z:.9,r:0});selectObject(item);moveMode=true;scheduleSave();notify('家具を追加しました。移動モードです')});if(selection&&tab==='furniture'){$('#move').onclick=()=>{moveMode=!moveMode;renderPanel()};$('#rotateL').onclick=()=>{snapshot();selection.rotation.y-=Math.PI/12;renderPanel();scheduleSave()};$('#rotateR').onclick=()=>{snapshot();selection.rotation.y+=Math.PI/12;renderPanel();scheduleSave()};$('#duplicate').onclick=()=>{snapshot();const item=addObject({...serialize().objects.find(o=>o.id===selection.userData.id),id:nextId++,x:Math.min(2.25,selection.position.x+.5),z:Math.min(3.25,selection.position.z+.5)});selectObject(item);scheduleSave()};$('#delete').onclick=()=>{snapshot();scene.remove(selection);objects.splice(objects.indexOf(selection),1);selection=null;moveMode=false;renderPanel();scheduleSave()}}if(tab==='interior'){for(const [key,prop] of [['wall','wallName'],['floor','floorName']]){$('#'+key).onchange=e=>{snapshot();if(prop==='wallName')wallName=e.target.value;else floorName=e.target.value;applyMaterials();scheduleSave()}}}if(tab==='window'){$('#lookAtWindow').onclick=focusWindow;document.querySelectorAll('[data-window]').forEach(b=>b.onclick=()=>{snapshot();windowView=b.dataset.window;timeOfDay=windowView==='citynight'?'night':windowView==='sunset'?'sunset':'day';applyMaterials();renderPanel();scheduleSave();notify('窓の景色を変更しました')})}if(tab==='lighting'){document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{snapshot();timeOfDay=b.dataset.time;applyMaterials();renderPanel();scheduleSave()});$('#light').onpointerdown=()=>snapshot();$('#light').oninput=e=>{lightStrength=Number(e.target.value);$('#lightValue').textContent=lightStrength+'%';applyMaterials();scheduleSave()}}}
let pointerStart=null;const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);function getRay(e){const b=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);raycaster.setFromCamera(mouse,camera)}
function hitObject(e){getRay(e);const hit=raycaster.intersectObjects(objects,true)[0];if(!hit)return null;let o=hit.object;while(o.parent&&!o.userData.id)o=o.parent;return o.userData.id?o:null}
renderer.domElement.addEventListener('pointerdown',e=>{if(!editing||e.button!==0||!e.isPrimary)return;pointerStart={x:e.clientX,y:e.clientY};const hit=hitObject(e);if(hit){selectObject(hit);if(moveMode){e.preventDefault();snapshot();dragging=true;oldDrag={x:hit.position.x,z:hit.position.z};controls.enabled=false;renderer.domElement.setPointerCapture(e.pointerId)}}});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging||!selection)return;getRay(e);const out=new THREE.Vector3();if(raycaster.ray.intersectPlane(ground,out)){selection.position.x=THREE.MathUtils.clamp(out.x,-2.35,2.35);selection.position.z=THREE.MathUtils.clamp(out.z,-3.36,3.36)}});
function finishDrag(){if(dragging){dragging=false;controls.enabled=true;moveMode=false;renderPanel();scheduleSave()}}
renderer.domElement.addEventListener('pointerup',finishDrag);renderer.domElement.addEventListener('pointercancel',finishDrag);
function updateDrawer(){const ed=$('#editor');ed.classList.toggle('open',editing);ed.classList.toggle('expanded',panelExpanded);ed.classList.toggle('collapsed',panelCollapsed);$('#expandPanel').textContent=panelExpanded?'⊟':'⤢';$('#collapsePanel').textContent=panelCollapsed?'⌃':'⌄';$('#expandPanel').setAttribute('aria-label',panelExpanded?'編集パネルを縮小':'編集パネルを拡大');$('#collapsePanel').setAttribute('aria-label',panelCollapsed?'編集パネルを開く':'編集パネルを折りたたむ')}
function cameraHome(){controls.enabled=true;dragging=false;controls.reset();controls.target.set(0,.7,-.25);const mobile=innerWidth<700;camera.fov=mobile?58:48;camera.position.set(mobile?13:11,mobile?10:8.5,mobile?20:14);camera.updateProjectionMatrix();controls.update();notify('部屋全体に戻しました')}
function cameraTop(){controls.target.set(0,0,0);camera.position.set(0,23,.01);controls.update();notify('真上からの視点')}
function zoomBy(factor){const v=camera.position.clone().sub(controls.target);v.multiplyScalar(factor);v.clampLength(controls.minDistance,controls.maxDistance);camera.position.copy(controls.target).add(v);controls.update()}
function focusWindow(){
  dragging=false;controls.enabled=true;
  const mobile=innerWidth<700;
  // From inside the room, look toward the back-wall window.
  controls.target.set(0,1.35,-3.65);
  camera.position.set(mobile?1.8:1.1,mobile?2.55:2.35,mobile?5.5:4.15);
  camera.fov=mobile?62:50;camera.updateProjectionMatrix();controls.update();
  notify('窓の方向に移動しました');
}
function openWindowPanel(){
  editing=true;tab='window';moveMode=false;panelCollapsed=false;panelExpanded=false;
  updateDrawer();renderPanel();$('#toggleEdit').textContent='DONE';
  focusWindow();
}
$('#quickWindow').onclick=openWindowPanel;
$('#focusWindow').onclick=focusWindow;
$('#cameraHome').onclick=cameraHome;$('#resetView').onclick=cameraHome;$('#cameraTop').onclick=cameraTop;$('#cameraZoomIn').onclick=()=>zoomBy(.8);$('#cameraZoomOut').onclick=()=>zoomBy(1.3);
$('#expandPanel').onclick=()=>{panelExpanded=!panelExpanded;panelCollapsed=false;updateDrawer()};$('#collapsePanel').onclick=()=>{panelCollapsed=!panelCollapsed;panelExpanded=false;updateDrawer()};$('#toggleEdit').onclick=()=>{editing=!editing;moveMode=false;panelCollapsed=innerWidth<700;panelExpanded=false;updateDrawer();$('#toggleEdit').textContent=editing?'DONE':'EDIT';$('#hint').textContent=editing?'家具を選択・移動は編集パネルから':'空間をドラッグして回転 · ピンチでズーム';renderPanel()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;panelCollapsed=false;updateDrawer();renderPanel()});$('#save').onclick=saveNow;$('#undo').onclick=()=>restore(undoStack,redoStack);$('#redo').onclick=()=>restore(redoStack,undoStack);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow()}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?restore(redoStack,undoStack):restore(undoStack,redoStack)}else if((e.key==='Delete'||e.key==='Backspace')&&selection&&editing&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){snapshot();scene.remove(selection);objects.splice(objects.indexOf(selection),1);selection=null;renderPanel();scheduleSave()}});
function fit(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',fit);cameraHome();
try{let saved=localStorage.getItem('roomverse-prototype-v3')||localStorage.getItem('roomverse-prototype-v2')||localStorage.getItem('roomverse-prototype-v1');apply(saved?JSON.parse(saved):{objects:defaults});if(!saved)saveNow()}catch(e){apply({objects:defaults})}refreshUndo();const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
